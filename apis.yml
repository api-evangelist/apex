name: Apex (Apex Security)
description: 'Apex Security was an AI security startup founded in 2023 in Tel Aviv by Matan Derman (CEO)
  and Tomer Avni (CPO), backed by Sequoia Capital, Index Ventures and angel investors including Sam Altman.
  Its platform gave enterprises visibility into generative-AI and LLM usage — public tools like ChatGPT and
  Gemini, Microsoft Copilot, and in-house AI applications — then let them define policy, detect violations
  and shadow AI, and respond to attacks across the AI attack surface. Tenable announced its intent to acquire
  Apex on 2025-05-29 and closed the acquisition in June 2025 for approximately $47.8M; the technology was
  folded into the Tenable One exposure management platform and now ships as Tenable One AI Exposure. Apex no
  longer operates as an independent company: the apexhq.ai domain has lapsed and was re-registered by an
  unrelated party on 2026-05-13, and now serves a Namecheap parking page. There is no Apex developer portal,
  documentation, or public API surface to catalog.'
